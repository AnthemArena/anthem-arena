# ========================================
# NETLIFY CONFIGURATION
# ========================================

[build]
  publish = "."
  command = "echo 'Static site - no build needed'"
  functions = "netlify/functions"           # ← Added: regular functions directory
  edge_functions = "netlify/edge-functions"  # ← Added: edge functions directory

[build.environment]
  NODE_VERSION = "18"
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

# Link-preview image (netlify/functions/og-match.js): resvg is a native module, so it stays external. Fonts are embedded (netlify/shared/og-fonts.js).
[functions]
  external_node_modules = ["@resvg/resvg-js"]
  node_bundler = "esbuild"

# Firebase credentials are set securely in Netlify UI (All scopes)
# No secrets in this file

# ========================================
# EDGE FUNCTIONS
# ========================================

# Link previews for shared match links: only rewrites the page for preview bots (Discord, X, WhatsApp ...)
[[edge_functions]]
  path = "/vote"
  function = "vote-meta"

[[edge_functions]]
  path = "/vote.html"
  function = "vote-meta"

[[edge_functions]]
  path = "/api/matches"
  function = "firebase-cache"

[[edge_functions]]
  path = "/api/match/*"
  function = "firebase-cache"

[[edge_functions]]
  path = "/api/track-view"
  function = "firebase-cache"

[[edge_functions]]
  path = "/api/view-stats"
  function = "firebase-cache"

[[edge_functions]]
  path = "/api/total-votes"
  function = "firebase-cache"

[[edge_functions]]
  path = "/api/activity"
  function = "firebase-cache"

[[edge_functions]]
  path = "/api/feed"
  function = "feed"

[[edge_functions]]
  path = "/api/profile"
  function = "profile"

# ========================================
# HEADERS - CRITICAL FIX
# ========================================

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=60"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/*.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"

[[headers]]
  for = "/js/*.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"

# ========================================
# REDIRECTS - ORDER MATTERS!
# ========================================

# The blog was removed: send old links to the feed
[[redirects]]
  from = "/blog/*"
  to = "/feed"
  status = 301

[[redirects]]
  from = "/blog"
  to = "/feed"
  status = 301

[[redirects]]
  from = "/blog.html"
  to = "/feed"
  status = 301

[[redirects]]
  from = "/blog-post.html"
  to = "/feed"
  status = 301

# Profile routes with username
[[redirects]]
  from = "/@:username"
  to = "/profile.html?user=:username"
  status = 200

# Activity and Feed routes
[[redirects]]
  from = "/activity"
  to = "/activity.html"
  status = 200

[[redirects]]
  from = "/feed"
  to = "/feed.html"
  status = 200

# Preview image of a match (see netlify/functions/og-match.js)
[[redirects]]
  from = "/og/match.png"
  to = "/.netlify/functions/og-match"
  status = 200

# Existing routes
[[redirects]]
  from = "/vote"
  to = "/vote.html"
  status = 200

[[redirects]]
  from = "/brackets"
  to = "/brackets.html"
  status = 200

[[redirects]]
  from = "/matches"
  to = "/matches.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

# My Votes was folded into the profile page
[[redirects]]
  from = "/my-votes"
  to = "/profile"
  status = 301

[[redirects]]
  from = "/my-votes.html"
  to = "/profile"
  status = 301

[[redirects]]
  from = "/profile"
  to = "/profile.html"
  status = 200

# ========================================
# CATCH-ALL - MUST BE LAST
# ========================================

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false