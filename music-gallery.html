<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edits Gallery | Arcane Moments</title>
    <meta name="description" content="Every fan edit that has entered an Arcane Moments cup: creators, records, results and a one-tap player.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Edits Gallery | Arcane Moments">
    <meta property="og:description" content="Every fan edit that has entered an Arcane Moments cup: creators, records and results.">

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">

    <!-- Fonts and icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/navigation.css">
    <link rel="stylesheet" href="/css/footer.css">
    <link rel="stylesheet" href="/css/scrollbar.css">
    <link rel="stylesheet" href="/css/settings.css">
    <link rel="stylesheet" href="/css/edits-gallery.css">
    <!-- Arcane look (opt-in via <body class="theme-arcane page-gallery">): load after every other stylesheet -->
    <link rel="stylesheet" href="/css/arcane-theme.generated.css">
    <link rel="stylesheet" href="/css/arcane-theme.css">

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "CollectionPage",
      "name": "Arcane Moments Edits Gallery",
      "description": "Fan edits that have entered an Arcane Moments cup, with creator credit, records and results."
    }
    </script>

    <!-- Global systems first -->
    <script type="module" src="/js/firebase-config.js"></script>
    <script type="module" src="/js/notification-storage.js"></script>
    <script type="module" src="/js/notification-center.js"></script>
    <script type="module" src="/js/global-notifications.js"></script>
</head>
<body class="theme-arcane page-gallery">

    <div id="nav-placeholder"></div>
    <script type="module" src="/js/navigation.js"></script>

    <main class="gallery-page">
        <header class="gallery-hero">
            <h1 class="gallery-title">Edits Gallery</h1>
            <p class="gallery-subtitle">Every fan edit that has entered an Arcane Moments cup, with its creator, record and result. Tap one to watch it.</p>
        </header>

        <section class="gallery-toolbar" aria-label="Search and filter edits">
            <div class="toolbar-row">
                <div class="toolbar-field toolbar-search">
                    <label for="searchInput">Search</label>
                    <input type="search" id="searchInput" placeholder="Edit title or creator" autocomplete="off">
                </div>
                <div class="toolbar-field">
                    <label for="statusFilter">Status</label>
                    <select id="statusFilter">
                        <option value="">All</option>
                        <option value="live">Live now</option>
                        <option value="bracket">In the bracket</option>
                        <option value="eliminated">Eliminated</option>
                        <option value="champion">Champions</option>
                        <option value="entered">Entered</option>
                    </select>
                </div>
                <div class="toolbar-field" hidden>
                    <label for="cupFilter">Cup</label>
                    <select id="cupFilter"><option value="">All cups</option></select>
                </div>
                <div class="toolbar-field">
                    <label for="sortSelect">Sort by</label>
                    <select id="sortSelect">
                        <option value="standing">Standing</option>
                        <option value="views">Most views</option>
                        <option value="wins">Most wins</option>
                        <option value="newest">Newest</option>
                        <option value="title">Title A-Z</option>
                        <option value="creator">Creator A-Z</option>
                    </select>
                </div>
            </div>
            <div class="chip-row" id="charFilters" role="group" aria-label="Filter by character" hidden></div>
            <p class="gallery-count" id="editCount" aria-live="polite"></p>
        </section>

        <section class="edit-grid" id="editGrid" aria-busy="true" aria-label="Edits">
            <div class="gallery-message"><p>Loading edits&hellip;</p></div>
        </section>

        <section class="gallery-next" aria-label="Keep exploring">
            <a href="/live" class="next-link"><i class="fa-solid fa-bolt" aria-hidden="true"></i><span>Vote in live matches</span></a>
            <a href="/brackets" class="next-link"><i class="fa-solid fa-trophy" aria-hidden="true"></i><span>See the bracket</span></a>
            <a href="/stats" class="next-link"><i class="fa-solid fa-chart-bar" aria-hidden="true"></i><span>Tournament stats</span></a>
        </section>
    </main>

    <dialog id="watchDialog" class="watch-dialog" aria-labelledby="watchTitle">
        <div class="watch-head">
            <h2 id="watchTitle"></h2>
            <button type="button" class="watch-close" id="watchClose" aria-label="Close player"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
        </div>
        <div class="watch-frame-wrap">
            <iframe id="watchFrame" title="Edit player" src="" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
        </div>
        <p class="watch-meta" id="watchMeta"></p>
    </dialog>

    <div id="footer-placeholder"></div>
    <script src="/js/footer.js"></script>

    <script type="module" src="/js/rank-system.js"></script>
    <script type="module" src="/js/music-gallery.js"></script>
    <script type="module" src="/js/settings-modal.js"></script>
</body>
</html>
