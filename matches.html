<!DOCTYPE html>
<html lang="en">
  
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO Meta Tags -->
    <title>Matches | Arcane Moments</title>
    <meta name="description" content="View every Arcane Moments match, result and schedule. See which edits are winning and cast your vote.">
    <link rel="canonical" href="https://arcanemoments.netlify.app/matches">
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
    
    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://arcanemoments.netlify.app/matches">
    <meta property="og:title" content="Matches | Arcane Moments">
    <meta property="og:description" content="Browse every Arcane Moments matchup, live results and voting history.">
    <meta property="og:image" content="https://arcanemoments.netlify.app/og-image.png">
    <meta property="og:image:alt" content="Arcane Moments match archive">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Matches | Arcane Moments">
    <meta name="twitter:description" content="View every Arcane Moments match and result.">
    <meta name="twitter:image" content="https://arcanemoments.netlify.app/og-image.png">
    <meta name="twitter:image:alt" content="Arcane Moments match archive">
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/navigation.css">
    <link rel="stylesheet" href="/css/matches.css">
    <link rel="stylesheet" href="/css/footer.css">
    <link rel="stylesheet" href="/css/scrollbar.css">
    <link rel="stylesheet" href="/css/settings.css">
    <!-- Arcane look (opt-in via <body class="theme-arcane">): load after every other stylesheet -->
    <link rel="stylesheet" href="/css/arcane-theme.generated.css">
    <link rel="stylesheet" href="/css/arcane-theme.css">

    
    <!-- Schema.org Structured Data - ItemList -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ItemList",
      "name": "Arcane Moments Matches",
      "description": "Complete archive of all tournament matches featuring K/DA, Pentakill, Worlds anthems, and more",
      "url": "https://arcanemoments.netlify.app/matches",
      "numberOfItems": 63,
      "itemListElement": []
    }
    </script>

     <!-- ✅ CRITICAL: Load global systems FIRST -->
    <script type="module" src="/js/firebase-config.js"></script>
    <script type="module" src="/js/notification-storage.js"></script>
    <script type="module" src="/js/notification-center.js"></script>

    <script type="module" src="/js/global-notifications.js"></script>
</head>
<body class="theme-arcane">

    <div id="nav-placeholder"></div>
<script type="module" src="/js/navigation.js"></script>

    <!-- MATCHES HEADER -->
    <section class="matches-header">
        <div class="container">
            <div class="header-content">
                <h1 class="page-title">Matches</h1>
                <p class="page-subtitle">Vote in the matches that are open, or look back at the ones that have finished</p>
            </div>

        </div>
    </section>

    </section>

    <!-- FILTERS & SEARCH: status chips first (the task), then search, then the less used filters behind one button -->
    <section class="filters-section">
        <div class="container">
            <input type="hidden" id="status-filter" value="needs">
            <div class="mt-chips" id="status-chips" role="group" aria-label="Filter by status"></div>
            <p class="mt-caught-up" id="caught-up" hidden></p>

            <div class="mt-toolbar">
                <div class="search-box">
                    <input
                        type="text"
                        id="search-input"
                        aria-label="Search edits or creators"
                        class="search-input"
                        placeholder="Search edits or creators..."
                        onkeyup="filterMatches()"
                    >
                    <button class="search-button" type="button" aria-label="Search">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
                            <path d="M9 17A8 8 0 1 0 9 1a8 8 0 0 0 0 16zM19 19l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                </div>
                <button type="button" class="mt-filters-btn" id="filters-toggle" aria-expanded="false" aria-controls="filters-panel">
                    Filters <span class="mt-badge" id="filters-badge" hidden></span>
                </button>
            </div>

            <div class="mt-filter-panel" id="filters-panel">
                <div class="filter-group" id="tournament-group">
                    <label class="filter-label" for="tournament-filter">Tournament</label>
                    <select id="tournament-filter" class="filter-select" onchange="filterMatches()">
                        <option value="all">All Tournaments</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label class="filter-label" for="round-filter">Round</label>
                    <select id="round-filter" class="filter-select" onchange="filterMatches()">
                        <option value="all">All Rounds</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label class="filter-label" for="sort-filter">Sort by</label>
                    <select id="sort-filter" class="filter-select" onchange="sortMatches()">
                        <option value="recent">Closing soonest</option>
                        <option value="votes-desc">Most Voted</option>
                        <option value="close">Closest Match</option>
                    </select>
                </div>
            </div>

            <div class="results-info">
                <span id="results-count" aria-live="polite"></span>
                <button type="button" class="mt-reset" id="reset-btn" onclick="clearFilters()" hidden>Reset</button>
            </div>
        </div>
    </section>



    <!-- MATCHES GRID -->
    <section class="matches-section">
        <div class="container">
          <div class="matches-grid" id="matches-grid">
   
</div>
            <div class="mt-more" id="show-more-wrap" hidden>
                <span class="mt-more-info" id="show-more-info"></span>
                <button type="button" class="mt-more-btn" id="show-more-btn">Show more</button>
            </div>


                <!-- More match cards would be dynamically loaded here -->
                
            </div>

        </div>
    </section>

    <!-- Add to matches.html before footer -->
<div id="loading-overlay" class="loading-overlay" style="display: none;">
    <div class="spinner-container">
        <div class="tournament-spinner">
            <div class="spinner-ring"></div>
            <div class="spinner-ring"></div>
            <div class="spinner-ring"></div>
            <i class="fas fa-trophy spinner-icon"></i>
        </div>
        <p class="spinner-text" id="spinner-text">Loading matches...</p>
    </div>
</div>


    <div id="footer-placeholder"></div>
    <script src="/js/footer.js"></script>


    <script type="module" src="/js/rank-system.js"></script>

<script type="module" src="/js/matches.js"></script>
<script type="module" src="/js/settings-modal.js"></script>
</body>
</html>
