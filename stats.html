<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Stats | Arcane Moments</title>
    <meta name="description" content="Live numbers from the current Arcane Moments cup: votes, edit rankings, group tables and records.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Stats | Arcane Moments">
    <meta property="og:description" content="Live votes, edit rankings, group tables and records from the current Arcane Moments cup.">

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">

    <!-- Fonts and icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/navigation.css">
    <link rel="stylesheet" href="/css/footer.css">
    <link rel="stylesheet" href="/css/scrollbar.css">
    <link rel="stylesheet" href="/css/settings.css">
    <link rel="stylesheet" href="/css/stats-arcane.css">
    <!-- Arcane look (opt-in via the theme-arcane body class): load after every other stylesheet -->
    <link rel="stylesheet" href="/css/arcane-theme.generated.css">
    <link rel="stylesheet" href="/css/arcane-theme.css">

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebPage",
      "name": "Arcane Moments Stats",
      "description": "Votes, rankings, group tables and records from the current Arcane Moments cup."
    }
    </script>

    <!-- Global systems first -->
    <script type="module" src="/js/firebase-config.js"></script>
    <script type="module" src="/js/notification-storage.js"></script>
    <script type="module" src="/js/notification-center.js"></script>
    <script type="module" src="/js/global-notifications.js"></script>
</head>
<body class="theme-arcane page-stats">

    <div id="nav-placeholder"></div>
    <script type="module" src="/js/navigation.js"></script>

    <main class="stats-page">
        <header class="stats-hero">
            <h1 class="stats-title">Cup Stats</h1>
            <p class="stats-subtitle" id="cupSubtitle">Live numbers from the current Arcane Moments cup: votes, rankings, group tables and records.</p>
            <p class="stats-updated" id="statsUpdated" aria-live="polite"></p>
        </header>

        <nav class="stats-tabs" role="tablist" aria-label="Stats sections">
            <button type="button" role="tab" class="stats-tab is-active" id="tab-overview" aria-controls="pane-overview" aria-selected="true" data-tab="overview"><i class="fa-solid fa-chart-column" aria-hidden="true"></i><span>Overview</span></button>
            <button type="button" role="tab" class="stats-tab" id="tab-edits" aria-controls="pane-edits" aria-selected="false" data-tab="edits" tabindex="-1"><i class="fa-solid fa-ranking-star" aria-hidden="true"></i><span>Edits</span></button>
            <button type="button" role="tab" class="stats-tab" id="tab-groups" aria-controls="pane-groups" aria-selected="false" data-tab="groups" tabindex="-1"><i class="fa-solid fa-table-cells-large" aria-hidden="true"></i><span>Groups</span></button>
            <button type="button" role="tab" class="stats-tab" id="tab-records" aria-controls="pane-records" aria-selected="false" data-tab="records" tabindex="-1"><i class="fa-solid fa-medal" aria-hidden="true"></i><span>Records</span></button>
        </nav>

        <section class="stats-pane" id="pane-overview" role="tabpanel" aria-labelledby="tab-overview" aria-busy="true">
            <p class="stats-message">Loading stats&hellip;</p>
        </section>
        <section class="stats-pane" id="pane-edits" role="tabpanel" aria-labelledby="tab-edits" hidden></section>
        <section class="stats-pane" id="pane-groups" role="tabpanel" aria-labelledby="tab-groups" hidden></section>
        <section class="stats-pane" id="pane-records" role="tabpanel" aria-labelledby="tab-records" hidden></section>

        <section class="stats-next" aria-label="Keep exploring">
            <a href="/live" class="next-link"><i class="fa-solid fa-bolt" aria-hidden="true"></i><span>Vote in live matches</span></a>
            <a href="/brackets" class="next-link"><i class="fa-solid fa-trophy" aria-hidden="true"></i><span>See the bracket</span></a>
            <a href="/music-gallery" class="next-link"><i class="fa-solid fa-film" aria-hidden="true"></i><span>Edits gallery</span></a>
            <a href="/profile#votes" class="next-link"><i class="fa-solid fa-circle-check" aria-hidden="true"></i><span>Your votes</span></a>
        </section>
    </main>

    <div id="footer-placeholder"></div>
    <script src="/js/footer.js"></script>

    <script type="module" src="/js/rank-system.js"></script>
    <script type="module" src="/js/stats.js"></script>
    <script type="module" src="/js/settings-modal.js"></script>
</body>
</html>
