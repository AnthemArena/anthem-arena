<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Redirecting to your profile | Arcane Moments</title>
    <meta name="robots" content="noindex">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- My Votes now lives on the profile page. Keeps the #hash (e.g. #achievements). -->
    <meta http-equiv="refresh" content="0; url=/profile">
    <script>
        (function () {
            var hash = window.location.hash || '#votes';
            window.location.replace('/profile' + hash);
        })();
    </script>
</head>
<body style="background:#0a0a0a;color:#fff;font-family:system-ui,sans-serif;text-align:center;padding:4rem 1rem;">
    <p>My Votes has moved. <a href="/profile#votes" style="color:#ff4fb4;">Go to your profile</a></p>
</body>
</html>
